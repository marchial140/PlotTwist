name: PlotTwist
options:
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: en
  knownRegions: [en, fr, Base]
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: targeted
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: '-O'
targets:
  PlotTwist:
    type: application
    platform: iOS
    sources:
      - path: PlotTwist
        excludes: [Resources/Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.plottwist
        INFOPLIST_FILE: PlotTwist/Resources/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
  PlotTwistTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PlotTwistTests]
    dependencies:
      - target: PlotTwist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.plottwist.tests
schemes:
  PlotTwist:
    build:
      targets:
        PlotTwist: all
        PlotTwistTests: [test]
    test:
      targets: [PlotTwistTests]
